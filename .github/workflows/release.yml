name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 版本一致性
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          node scripts/check-version.mjs --tag $tag
          node scripts/check-docs-links.mjs
          ./scripts/check-doc-facts.ps1

      - name: Build
        run: dotnet build VScreenPilot.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/VScreenPilot.Tests.Unit/VScreenPilot.Tests.Unit.csproj -c Release

      - name: Contract tests
        run: dotnet test tests/VScreenPilot.Tests.Contract/VScreenPilot.Tests.Contract.csproj -c Release

      - name: 冒烟
        run: |
          dotnet publish src/VScreenPilot.Server/VScreenPilot.Server.csproj -c Release -r win-x64 -o artifacts/server
          python tools/audit/smoke_no_display.py --exe artifacts/server/VScreenPilot.exe
          node tools/TestTool/smoke-v2.mjs
          node tools/TestTool/share-smoke.mjs
          node tools/TestTool/daemon-smoke.mjs

      - name: 生成 zip + SHA256
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          ./scripts/release.ps1 -Version $version

      - name: 生成 SHA256SUMS 与 winget 清单
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''

          $assets = Get-ChildItem artifacts/release -File |
            Where-Object { $_.Extension -in '.zip', '.exe' }
          $lines = $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content artifacts/release/SHA256SUMS.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

          # 用刚构建出的安装包回填 winget 清单，保证提交到 main 的 SHA 与 Release 资产一致。
          ./scripts/update-winget.ps1 -Version $version
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\winget" -Force | Out-Null
          Copy-Item packaging/winget/*.yaml "$env:RUNNER_TEMP\winget" -Force

          Push-Location "$env:RUNNER_TEMP\winget"
          try {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              winget validate --manifest .
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "winget validate 返回 $LASTEXITCODE；以 winget-pkgs PR 校验为准"
              }
            } else {
              Write-Warning "CI 上没有 winget，跳过 winget validate"
            }
          } finally {
            Pop-Location
          }

          git checkout -- packaging/winget

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            artifacts/release/VScreenPilot-win-x64-*.zip
            artifacts/release/VScreenPilot-symbols-*.zip
            artifacts/release/VScreenPilot-Setup-*.exe
            artifacts/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 同步 winget 清单到 main
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          $temp = "$env:RUNNER_TEMP\winget"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          Copy-Item "$temp\*.yaml" "packaging/winget" -Force
          git add packaging/winget

          if (git diff --cached --quiet) {
            Write-Host "winget 清单无变化，跳过提交"
            exit 0
          }

          git commit -m "chore(winget): 同步 $version 安装包 SHA [skip ci]"
          git push origin main

      - name: 上传发布产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
