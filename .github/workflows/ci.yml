name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VScreenPilot.slnx

      - name: Build
        run: dotnet build VScreenPilot.slnx -c Release --no-restore

      - name: Docs links
        run: node scripts/check-docs-links.mjs

      - name: Architecture metrics
        run: |
          python tools/audit/arch_metrics.py --selftest
          python tools/audit/arch_metrics.py --check

      - name: Version consistency
        run: node scripts/check-version.mjs

      - name: Unit tests
        run: |
          dotnet test tests/VScreenPilot.Tests.Unit/VScreenPilot.Tests.Unit.csproj -c Release --logger "trx;LogFileName=unit.trx"
          dotnet test tests/VScreenPilot.Tests.Contract/VScreenPilot.Tests.Contract.csproj -c Release --logger "trx;LogFileName=contract.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: "**/*.trx"

  smoke:
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/VScreenPilot.Server/VScreenPilot.Server.csproj -c Release -r win-x64 -o artifacts/server

      - name: Protocol smoke (no display)
        # 不挂虚拟屏：只验证 initialize / tools/list / schema / 错误形状 / resources。
        run: python tools/audit/smoke_no_display.py --exe artifacts/server/VScreenPilot.exe

      - name: Contract baseline diff
        # 只比 schema 与错误包：cli.json 的 doctor 含驱动/Office/分辨率，跨机器必然不同。
        # 版本号变更时，需要用新二进制重抓 tools/audit/baseline/<commit> 并提交。
        run: |
          python tools/audit/capture_baseline.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/contract
          python tools/audit/compare_baseline.py tools/audit/baseline/3ddb85b tools/audit/results/contract --only server.json --only errors.json

      - name: Shared-instance smoke (no display)
        # 共享实例/独立 daemon/CLI：脚本自带随机 profile 与 VSP_NO_WARMUP。
        run: |
          node tools/TestTool/smoke-v2.mjs
          node tools/TestTool/share-smoke.mjs
          node tools/TestTool/daemon-smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: tools/audit/results/smoke/**

  gui-nightly:
    # 需要真实交互桌面 + Parsec VDD，只能在自托管 runner 上跑。
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, windows, x64, vdd]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/VScreenPilot.Server/VScreenPilot.Server.csproj -c Release -r win-x64 -o artifacts/server

      - name: Protocol / contract / concurrency / capture
        run: |
          python tools/audit/bench_protocol.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/nightly --fuzz 500
          python tools/audit/bench_contract.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/nightly
          python tools/audit/bench_concurrency.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/nightly
          python tools/audit/bench_capture_soak.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/nightly
          python tools/audit/bench_gui2.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/nightly

      - name: PPT / Office fixes (requires PowerPoint + VDD)
        shell: pwsh
        env:
          VSP_PROFILE: pptci
          VSP_DISPLAY_OFFSET: "0"
        run: |
          if (Test-Path "artifacts/ppt/VScreenPilot-PPT-测评.pptx") {
            python tools/audit/ppt/bench_ppt_fixes.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/ppt-run/ppt-fixes
            python tools/audit/ppt/bench_ppt_flow.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/ppt-run/ppt-flow
            python tools/audit/ppt/bench_ppt_extra.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/ppt-run/ppt-extra
            python tools/audit/ppt/bench_ppt_unsaved.py --exe artifacts/server/VScreenPilot.exe --out tools/audit/results/ppt-run/ppt-unsaved
            python tools/audit/ppt/check_ppt_slo.py
          } else {
            Write-Host "PPT deck not found; skipping PPT suites"
          }

      - name: SLO gate
        run: python tools/audit/check_slo.py --results tools/audit/results/nightly

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: tools/audit/results/nightly/**
